appId: com.rikeey98.one-desk
# 지금의 실효 앱 이름과 정확히 같아야 한다. Electron은 userData를
# appData + 앱 이름으로 만들고 앱 이름은 productName을 우선하므로,
# 이 값을 바꾸면 기존 사용자 데이터 디렉토리를 더 이상 보지 않는다.
productName: one-desk

# electron/main.ts가 app.isPackaged일 때 process.resourcesPath에서
# 마이그레이션을 찾는다.
extraResources:
  - from: drizzle
    to: drizzle
  # MCP stdio 브리지. claude가 자식 프로세스로 띄우는 원본 .mjs라 번들되지 않는다.
  # asar 안에 두지 않는 이유: ELECTRON_RUN_AS_NODE로 띄운 프로세스가 asar 내부
  # 경로를 실행할 수 있는지가 플랫폼마다 미묘하다. 그 불확실성을 살 이유가 없다.
  - from: core/mcp/bridge.mjs
    to: mcp-bridge.mjs
# 패키징하면서 네이티브 모듈을 다시 빌드하지 않는다 (docs/sdlc/code-editor/terminal-plan.md 11단계).
# electron-builder의 재빌드(@electron/rebuild)는 node-pty가 품은 N-API 사전 빌드를 알아보지 못하고 소스에서
# 컴파일하려다 실패한다(npm 패키지에 winpty의 GetCommitHash.bat이 없다 — 2026-10-10 실측). Electron용 빌드는
# 이미 postinstall(`electron-rebuild -w better-sqlite3`)이 했고, node-pty는 N-API라 다시 빌드할 것이 없다.
npmRebuild: false

# 네이티브 .node는 asar 안에서 로드되지 않는다.
# node-pty는 .node 말고도 conpty.dll·OpenConsole.exe·winpty-agent.exe를 자기 폴더에서 찾아 띄운다 —
# 폴더째 밖에 둔다 (docs/sdlc/code-editor/terminal-plan.md 0단계).
asarUnpack:
  - '**/node_modules/better-sqlite3/**'
  - '**/node_modules/node-pty/**'

mac:
  target: dmg
  # 유료 인증서 없이 Apple Silicon에서 실행되려면 ad-hoc 서명이 필요하다.
  # identity를 비우면 electron-builder가 링커의 ad-hoc 서명을 깨뜨린 채로
  # 두어 "앱이 손상되었습니다"가 뜨고, 이것은 xattr로 풀리지 않는다.
  identity: '-'
  artifactName: ${name}-${version}-${arch}.${ext}

win:
  target: portable
  artifactName: ${name}-${version}-${arch}.${ext}

linux:
  target: AppImage
  category: Development
  artifactName: ${name}-${version}-${arch}.${ext}

appId: com.rikeey98.one-desk
# 지금의 실효 앱 이름과 정확히 같아야 한다. Electron은 userData를
# appData + 앱 이름으로 만들고 앱 이름은 productName을 우선하므로,
# 이 값을 바꾸면 기존 사용자 데이터 디렉토리를 더 이상 보지 않는다.
productName: one-desk

# electron/main.ts가 app.isPackaged일 때 process.resourcesPath에서
# 마이그레이션을 찾는다.
extraResources:
  - from: drizzle
    to: drizzle
  # MCP stdio 브리지. claude가 자식 프로세스로 띄우는 원본 .mjs라 번들되지 않는다.
  # asar 안에 두지 않는 이유: ELECTRON_RUN_AS_NODE로 띄운 프로세스가 asar 내부
  # 경로를 실행할 수 있는지가 플랫폼마다 미묘하다. 그 불확실성을 살 이유가 없다.
  - from: core/mcp/bridge.mjs
    to: mcp-bridge.mjs
  # WSL 런처 (docs/sdlc/wsl-support/ FR-10). wsl.exe가 /bin/sh로 읽는 원본 .sh라 브리지와 같은 이유로 asar 밖이다.
  - from: core/wsl/launcher.sh
    to: wsl-launcher.sh
# 패키징하면서 네이티브 모듈을 다시 빌드하지 않는다 (docs/sdlc/code-editor/terminal-plan.md 11단계).
# electron-builder의 재빌드(@electron/rebuild)는 node-pty가 품은 N-API 사전 빌드를 알아보지 못하고 소스에서
# 컴파일하려다 실패한다(npm 패키지에 winpty의 GetCommitHash.bat이 없다 — 2026-10-10 실측). Electron용 빌드는
# 이미 postinstall(`electron-rebuild -w better-sqlite3`)이 했고, node-pty는 N-API라 다시 빌드할 것이 없다.
npmRebuild: false

# 네이티브 .node는 asar 안에서 로드되지 않는다.
# node-pty는 .node 말고도 conpty.dll·OpenConsole.exe·winpty-agent.exe를 자기 폴더에서 찾아 띄운다 —
# 폴더째 밖에 둔다 (docs/sdlc/code-editor/terminal-plan.md 0단계).
asarUnpack:
  - '**/node_modules/better-sqlite3/**'
  - '**/node_modules/node-pty/**'

mac:
  target: dmg
  # 유료 인증서 없이 Apple Silicon에서 실행되려면 ad-hoc 서명이 필요하다.
  # identity를 비우면 electron-builder가 링커의 ad-hoc 서명을 깨뜨린 채로
  # 두어 "앱이 손상되었습니다"가 뜨고, 이것은 xattr로 풀리지 않는다.
  identity: '-'
  artifactName: ${name}-${version}-${arch}.${ext}

win:
  target: portable
  artifactName: ${name}-${version}-${arch}.${ext}

# 포터블 실행 파일은 실행할 때마다 자기만의 임시 폴더(%TEMP%\nsXXXX.tmp\app)에 앱을 푼다 (docs/sdlc/portable-unpack/).
# 기본값(빌드마다 고정된 이름 하나)이면 앱이 떠 있는 동안 같은 exe를 다시 실행했을 때, 두 번째 실행이 풀기 전과 끝난 뒤
# 그 폴더를 지워 첫 인스턴스가 나중에 읽는 파일(wsl-launcher.sh·mcp-bridge.mjs·node-pty)이 사라졌다(v0.26.2 실측).
# **문서와 반대로 true다** — 문서는 false가 실행마다 새 폴더라지만 electron-builder 26의 코드는 false를 기본값처럼 다룬다(실측).
# core/app/portableUnpack.test.ts가 그 판정을 지킨다. 비정상 종료가 남긴 폴더는 다음 실행이 지운다(core/app/portableUnpack.ts).
portable:
  unpackDirName: true

linux:
  target: AppImage
  category: Development
  artifactName: ${name}-${version}-${arch}.${ext}

# 리눅스 패키지의 Electron 실행 파일 앞에 실행 껍데기(build/linux/launcher.sh)를 세운다 (docs/sdlc/linux-launch-env/) —
# 사용자의 LD_LIBRARY_PATH에 오래된 libexpat이 있으면 Electron이 시작조차 못 한다(RHEL, XML_SetHashSalt). 다른 플랫폼에서는
# 아무것도 하지 않는다. 돌았는지는 릴리스 CI가 만들어진 AppImage로 본다(build/linux/check-appimage.sh).
afterPack: ./build/linux/afterPack.mjs

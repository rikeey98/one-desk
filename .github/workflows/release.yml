name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      # 한 플랫폼이 깨져도 나머지 산출물은 보고 싶다.
      fail-fast: false
      matrix:
        # **지금은 Windows만 만든다.** 받아서 쓰는 사람이 Windows뿐이고,
        # 아래 release job이 `needs: build`라 mac/linux가 깨지면 Windows
        # 산출물까지 릴리스에 못 올라간다. 셋은 병렬로 돌아 시간은 거의
        # 같았지만(가장 느린 Windows가 전체를 결정한다), 실패 표면은 줄어든다.
        #
        # 다시 넣으려면 아래에 두 줄씩 더한다:
        #   - os: macos-latest
        #     flag: --mac
        #   - os: ubuntu-latest
        #     flag: --linux
        # macOS는 개발 장비에서 `pnpm run pack`으로 언제든 만들 수 있다.
        include:
          # windows-latest가 아니라 고정 이미지인 이유:
          # 최신 이미지에는 Visual Studio 18이 깔려 있는데 pnpm이 번들한
          # node-gyp 11.1.0이 그 버전을 못 읽어 better-sqlite3 컴파일이
          # "could not find a version of Visual Studio 2017 or newer"로 죽는다.
          # node-gyp가 VS 18을 지원하면 windows-latest로 되돌린다.
          - os: windows-2022
            flag: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # electron-builder는 산출물 이름과 앱 버전을 package.json에서만 읽는다.
      # 태그와 어긋나면 v0.2.0 릴리스에 0.1.0 파일이 조용히 올라간다.
      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "태그($tag)와 package.json 버전($pkg)이 다릅니다." >&2
            exit 1
          fi

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # postinstall의 electron-rebuild가 better-sqlite3를 이 러너의
      # Electron ABI에 맞춰 컴파일한다. 크로스 컴파일이 불가능한 이유다.
      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      - run: pnpm build
      # --publish never가 없으면 electron-builder가 GH_TOKEN을 발견했을 때
      # 스스로 릴리스에 올려 아래 release job과 이중으로 올린다.
      - run: pnpm exec electron-builder ${{ matrix.flag }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
          if-no-files-found: error

  release:
    # 세 빌드가 모두 성공해야 돈다. 러너가 각자 올리면 셋이 같은 릴리스를
    # 만들려 경쟁하고, 하나가 실패해도 나머지가 이미 올려버린다.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          # 세 산출물이 다 올라왔는지 사람이 보고 publish를 누른다.
          draft: true
          generate_release_notes: true
          files: artifacts/*
          body: |
            ## 설치 (Windows)

            `one-desk-*-x64.exe`는 포터블 실행 파일입니다. 설치 없이 바로 실행됩니다.
            SmartScreen 경고가 뜨면 "추가 정보" → "실행"을 누르세요.

            ## 첫 실행 전에

            **agent CLI가 하나 이상 설치돼 있어야 합니다.** 어느 것으로 돌릴지는 실행
            패널의 agent 드롭다운에서 run마다 고릅니다. 기본값은 Claude Code입니다.

            ### Claude Code

            흔한 설치 위치는 자동으로 찾습니다. 못 찾으면 workspace 설정의
            "claude 경로"에 `where.exe claude` 결과를 넣으세요.

            npm 전역 설치(`claude.cmd`)는 지원하지 않습니다 — Node가 배치 파일을
            직접 실행하지 못해서(CVE-2024-27980) 프리플라이트에서 거부됩니다.
            네이티브 설치 스크립트로 `claude.exe`를 설치해 주세요.

            AWS Bedrock 환경이라면 `CLAUDE_CODE_USE_BEDROCK` 같은 값이 **Windows
            사용자/시스템 환경 변수**에 등록돼 있어야 합니다. PowerShell 프로필에만
            있으면 앱이 물려받지 못합니다.

            ### OpenCode

            `opencode`를 설치하고 로그인해 두세요. 경로를 못 찾으면 workspace 설정의
            "opencode 경로"에 넣습니다. `.cmd` 설치본을 거부하는 것은 Claude Code와
            같은 이유입니다.

            모델은 `provider/model` 형식으로 적습니다 — 예: `anthropic/claude-sonnet-4-5`.

            **작업할 repo에 `opencode.json`이 있고 거기 권한이 "물어보기"(ask)로 적혀
            있으면 실행을 거부하고 어떤 키가 문제인지 알려줍니다.** 헤드리스 실행에는
            물음에 답할 사람이 없어 그대로 멈추기 때문입니다. 그 항목을 지우거나
            allow/deny로 바꾸면 됩니다 — one-desk가 만드는 설정으로는 그 파일을
            덮어쓸 수 없습니다.

            대화를 이어갈 때는 agent가 잠깁니다. 세션은 그것을 만든 CLI의 것이라
            다른 CLI로 이어받을 수 없습니다.

            ## macOS / Linux

            이 릴리스는 Windows 산출물만 담습니다. 다른 플랫폼이 필요하면
            저장소를 받아 `pnpm run pack`으로 직접 빌드하세요.

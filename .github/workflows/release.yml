name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      # 한 플랫폼이 깨져도 나머지 산출물은 보고 싶다.
      fail-fast: false
      matrix:
        # **Windows와 Linux를 만든다.** 아래 release job이 `needs: build`라
        # 하나가 깨지면 다른 산출물까지 릴리스에 못 올라간다 — 플랫폼을 더할수록
        # 실패 표면이 는다. macOS를 빼 둔 이유가 그것이다.
        #
        # macOS를 다시 넣으려면 아래에 두 줄을 더한다:
        #   - os: macos-latest
        #     flag: --mac
        # macOS는 개발 장비에서 `pnpm run pack`으로 언제든 만들 수 있다.
        include:
          # windows-latest가 아니라 고정 이미지인 이유:
          # 최신 이미지에는 Visual Studio 18이 깔려 있는데 pnpm이 번들한
          # node-gyp 11.1.0이 그 버전을 못 읽어 better-sqlite3 컴파일이
          # "could not find a version of Visual Studio 2017 or newer"로 죽는다.
          # node-gyp가 VS 18을 지원하면 windows-latest로 되돌린다.
          - os: windows-2022
            flag: --win
          # AppImage 하나. 이 러너에서 컴파일한 네이티브 모듈은 러너의 glibc에 링크되므로
          # 아래 "Rebuild native modules on glibc 2.28"이 RHEL 8 위에서 다시 빌드한다.
          - os: ubuntu-latest
            flag: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # electron-builder는 산출물 이름과 앱 버전을 package.json에서만 읽는다.
      # 태그와 어긋나면 v0.2.0 릴리스에 0.1.0 파일이 조용히 올라간다.
      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "태그($tag)와 package.json 버전($pkg)이 다릅니다." >&2
            exit 1
          fi

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # postinstall의 electron-rebuild가 better-sqlite3를 이 러너의
      # Electron ABI에 맞춰 컴파일한다. 크로스 컴파일이 불가능한 이유다.
      - run: pnpm install --frozen-lockfile

      # 네이티브 모듈 둘(better-sqlite3·node-pty)을 glibc 2.28(RHEL 8) 위에서 다시 빌드한다 (docs/sdlc/linux-glibc-floor/).
      # 러너에서 컴파일한 node-pty와 better-sqlite3가 품은 사전 빌드는 `GLIBC_2.34`를 요구해 RHEL 8에서 시작조차 못 한다.
      # 아래 pnpm test는 다시 빌드한 것으로 돈다. 이미지는 2주 넘은 태그를 다이제스트로 고정한다 — 올릴 때는 둘을 같이 바꾼다.
      - name: Rebuild native modules on glibc 2.28
        if: matrix.os == 'ubuntu-latest'
        run: |
          node_dir="$(dirname "$(dirname "$(command -v node)")")"
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e NODE_DIR="$node_dir" \
            -v "$PWD:$PWD" -w "$PWD" -v "$node_dir:$node_dir:ro" \
            quay.io/pypa/manylinux_2_28_x86_64:2026.09.29-1@sha256:407f771c51a2c3e83ebe5a7970b4289ead3a6db21d9b9c089168775cad11d328 \
            bash build/linux/build-native.sh

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      - run: pnpm build
      # --publish never가 없으면 electron-builder가 GH_TOKEN을 발견했을 때
      # 스스로 릴리스에 올려 아래 release job과 이중으로 올린다.
      - run: pnpm exec electron-builder ${{ matrix.flag }} --publish never

      # 사용자의 LD_LIBRARY_PATH에 오래된 libexpat이 있어도 AppImage가 뜨는지(docs/sdlc/linux-launch-env/), 패키지가 RHEL 8의
      # glibc 안에서 돌고 네이티브 모듈이 패키지의 Electron에서 뜨는지(docs/sdlc/linux-glibc-floor/) 산출물로 본다.
      # afterPack 훅이나 위의 다시 빌드가 돌지 않아도 빌드는 초록이다 — RHEL에서 v0.26.0까지는 시작조차 못 했다.
      - name: Check the Linux launcher in the AppImage
        if: matrix.os == 'ubuntu-latest'
        run: bash build/linux/check-appimage.sh dist/*.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
          if-no-files-found: error

  release:
    # 모든 빌드가 성공해야 돈다. 러너가 각자 올리면 서로 같은 릴리스를
    # 만들려 경쟁하고, 하나가 실패해도 나머지가 이미 올려버린다.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # 릴리스 노트(docs/releases/<태그>.md)와 설치 안내(.github/release-install.md)만 필요하다.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docs/releases
            .github/release-install.md
          sparse-checkout-cone-mode: false

      # 본문 = 이 버전의 변경 내용 + 설치 안내. **노트 파일이 없으면 실패한다** — 변경 내용 없이
      # 설치 안내와 compare 링크만 담긴 릴리스가 조용히 나가지 않게.
      - name: 릴리스 본문 조립
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [ ! -f "$notes" ]; then
            echo "::error::릴리스 노트가 없습니다: $notes"
            exit 1
          fi
          { cat "$notes"; echo; cat .github/release-install.md; } > release-body.md

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          # 산출물이 다 올라왔는지 사람이 보고 publish를 누른다.
          draft: true
          generate_release_notes: true
          files: artifacts/*
          body_path: release-body.md
